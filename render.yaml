services:
  - type: web
    name: restaurant-order-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: restaurant-order-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: restaurant-order-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: restaurant-order-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: restaurant-order-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: restaurant-order-db
          property: password
      - key: FRONTEND_URLS
        sync: false

  - type: web
    name: restaurant-order-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: restaurant-order-db
    plan: free
